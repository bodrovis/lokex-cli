name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: go.mod
        check-latest: false
        cache: false
        

    - name: Check Go modules
      run: |
        set -euo pipefail
        go mod tidy
        git diff --exit-code -- go.mod go.sum
        go mod verify

    - name: Run tests
      run: go test -count=1 -coverprofile=coverage.out ./... -v -shuffle=on

    - uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5
      with:
        token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
        files: coverage.out
        strip-prefix: github.com/bodrovis/lokex-cli/