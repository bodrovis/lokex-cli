name: GoReleaser

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: goreleaser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Install verified UPX
        shell: bash
        run: |
          set -euo pipefail

          UPX_VERSION="5.2.1"
          UPX_ARCHIVE="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          UPX_SHA256="402162AAD30AF47E60DBD767FB2E64CA394ACE9727BA1F40283641F1D1B91657"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --output "$TMP_DIR/$UPX_ARCHIVE" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_ARCHIVE}"

          echo "${UPX_SHA256}  $TMP_DIR/$UPX_ARCHIVE" |
            sha256sum --check -

          tar \
            -xJf "$TMP_DIR/$UPX_ARCHIVE" \
            -C "$TMP_DIR"

          sudo install \
            -m 0755 \
            "$TMP_DIR/upx-${UPX_VERSION}-amd64_linux/upx" \
            /usr/local/bin/upx

          upx --version

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Run tests
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find checksum manifest
        id: checksums
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name "*_checksums.txt" \
              -print
          )

          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one checksum manifest, found ${#files[@]}:" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi

          mkdir -p _attestation
          cp "${files[0]}" _attestation/checksums.txt

          echo "Checksum manifest: ${files[0]}"
          cat _attestation/checksums.txt

      - name: Upload checksum manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-checksums
          path: _attestation/checksums.txt
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Generate release attestations
    runs-on: ubuntu-latest

    needs:
      - release

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Download checksum manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-checksums
          path: _attestation

      - name: Validate checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s _attestation/checksums.txt
          cat _attestation/checksums.txt

      - name: Generate artifact attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-checksums: _attestation/checksums.txt