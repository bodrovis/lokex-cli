name: GoReleaser

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: goreleaser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign, and publish release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      # v7.0.0
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false

      # v6.5.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Install verified UPX
        shell: bash
        run: |
          set -euo pipefail

          UPX_VERSION="5.2.0"
          UPX_ARCHIVE="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          UPX_SHA256="3db5d3294707439db97866feab8d75d800f028f48481a40547411824da4288a1"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --output "$UPX_ARCHIVE" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${UPX_ARCHIVE}"

          echo "${UPX_SHA256}  ${UPX_ARCHIVE}" |
            sha256sum --check -

          tar -xJf "$UPX_ARCHIVE"

          sudo install \
            -m 0755 \
            "upx-${UPX_VERSION}-amd64_linux/upx" \
            /usr/local/bin/upx

          upx --version

      # v0.24.0
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610

      # v4.1.2
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Run tests
        run: go test ./...

      # v7.2.3
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find checksum manifest
        id: checksums
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t files < <(
            find dist \
              -maxdepth 1 \
              -type f \
              -name "*_checksums.txt" \
              -print
          )

          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one checksum manifest, found ${#files[@]}:" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi

          mkdir -p _attestation
          cp "${files[0]}" _attestation/checksums.txt

          echo "Checksum manifest: ${files[0]}"
          cat _attestation/checksums.txt

      # v7.0.1
      - name: Upload checksum manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-checksums
          path: _attestation/checksums.txt
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Generate release attestations
    runs-on: ubuntu-latest

    needs:
      - release

    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      # v8.0.1
      - name: Download checksum manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-checksums
          path: _attestation

      - name: Validate checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s _attestation/checksums.txt
          cat _attestation/checksums.txt

      # v4.1.0
      - name: Generate artifact attestations
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-checksums: _attestation/checksums.txt